# Reusable workflow: fails a PR unless it links at least one issue in the same repo
# and every linked issue has a Summary and Acceptance Criteria.
# Make the resulting check ("pr / validate") a required status check on the default branch.
name: Issue-first / PR gate

on:
  workflow_call:
    inputs:
      min-length:
        description: Minimum characters for Summary and Acceptance Criteria
        type: number
        default: 20
      exempt-authors:
        description: Comma-separated PR authors that skip the gate (bots)
        type: string
        default: "dependabot[bot],renovate[bot]"
      kit-ref:
        description: Branch or tag of manjunathhk/.github to load the validator from
        type: string
        default: v1

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Load validator
        uses: actions/checkout@v5
        with:
          repository: manjunathhk/.github
          ref: ${{ inputs.kit-ref }}
          path: .issue-first
          sparse-checkout: actions/issue-first
          persist-credentials: false

      - name: Validate linked issues
        uses: actions/github-script@v8
        env:
          MODE: pr
          MIN_LENGTH: ${{ inputs.min-length }}
          EXEMPT_AUTHORS: ${{ inputs.exempt-authors }}
        with:
          script: |
            const run = require(`${process.env.GITHUB_WORKSPACE}/.issue-first/actions/issue-first/validate.js`);
            await run({ github, context, core });
